<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<title>SCA Sales Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237A1420'/><path d='M8 22 L14 14 L19 18 L25 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  color-scheme: light only;
  --ground:#FDF9F4; --surface:#FFFFFF; --surface-2:#F7EFEA; --surface-3:#F1E4DD;
  --ink:#221418; --ink-2:#4C3A3D; --ink-3:#8A7477;
  --accent:#7A1420; --hair:#E4D6CF; --hair-2:#F0E4DE;
  --good:#2F6B4F; --warn:#9A6B12; --crit:#B3261E; --good-bg:#E6F0EA; --warn-bg:#F6EEDD; --crit-bg:#F8E6E4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --shadow:0 1px 2px rgba(34,20,24,.05), 0 8px 24px -14px rgba(34,20,24,.16);
  --display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink-2);font-family:var(--ui);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:var(--ui)}
.wrap{max-width:1380px;margin:0 auto;padding:22px 16px 80px}
h1{font-family:var(--display);font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
.sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
select,input{font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:6px 9px}
.btn{appearance:none;border:1px solid var(--hair);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--surface-2)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--ink-3)}
.pill{border:1px solid var(--hair);border-radius:12px;padding:2px 9px;background:var(--surface);display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}.dot.bad{background:var(--crit)}.dot.warn{background:var(--warn)}
.banner{border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px;border:1px solid}
.banner.crit{background:var(--crit-bg);border-color:#E5B5B1;color:var(--crit)} .banner.warn{background:var(--warn-bg);border-color:#E7D3A5;color:var(--warn)}
.banner ul{margin:4px 0 0 18px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.sec-h h2{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink)}
.sec-h .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.sec-h .note{font-size:12px;color:var(--ink-3)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g6{grid-template-columns:repeat(6,1fr)} .g2{grid-template-columns:2fr 1fr}
@media (max-width:1000px){.g4,.g6{grid-template-columns:repeat(2,1fr)} .g3,.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g4,.g6{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.tile{cursor:pointer;position:relative} .tile:hover{border-color:var(--accent)}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.tile .k .n{font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border-radius:10px;padding:0 7px;color:var(--ink-2)}
.tile .v{font-family:var(--display);font-size:30px;font-weight:600;color:var(--ink);margin-top:6px;line-height:1.1}
.tile .v.sm{font-size:24px}
.tile .d{font-size:12px;color:var(--ink-3);margin-top:6px;border-top:1px solid var(--hair-2);padding-top:6px}
.delta{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:9px;margin-right:4px}
.delta.up{background:var(--good-bg);color:var(--good)}.delta.dn{background:var(--crit-bg);color:var(--crit)}.delta.flat{background:var(--surface-2);color:var(--ink-3)}
.road{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.road .big{font-family:var(--display);font-size:34px;color:var(--ink)}
.road .bar{flex:1;min-width:260px;height:22px;background:var(--surface-2);border-radius:11px;overflow:hidden;display:flex}
.road .bar i{display:block;height:100%} .road .bar .w{background:var(--good)} .road .bar .dep{background:#8FC6A8}
.flow .row{display:grid;grid-template-columns:90px 1fr 120px;align-items:center;gap:12px;margin:8px 0}
.flow .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.flow .bar{height:40px;background:var(--surface-2);border-radius:6px;overflow:hidden;cursor:pointer}
.flow .bar i{display:flex;align-items:center;padding-left:12px;height:100%;color:#fff;font-family:var(--display);font-size:20px;font-weight:600;border-radius:6px;min-width:44px}
.flow .meta{font-size:12px;color:var(--ink-3);text-align:right}
.states{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
@media (max-width:900px){.states{grid-template-columns:repeat(3,1fr)}}
.state{border:1px solid var(--hair);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--surface)} .state:hover{border-color:var(--accent)}
.state .k{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)} .state .v{font-family:var(--display);font-size:22px;color:var(--ink)}
.state .d{font-size:11px;color:var(--ink-3)}
.outbar{display:flex;height:40px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.outbar i{display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-family:var(--mono);font-size:12.5px;cursor:pointer;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:8px} .legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer} .legend b{width:11px;height:11px;border-radius:3px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px} th{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:8px 8px;border-bottom:1px solid var(--hair)}
td{padding:8px 8px;border-bottom:1px solid var(--hair-2);text-align:right;font-variant-numeric:tabular-nums} th:first-child,td:first-child{text-align:left}
td.c{cursor:pointer;color:var(--accent)} td.c:hover{text-decoration:underline}
tr.total td{font-weight:700;border-top:2px solid var(--hair);color:var(--ink)}
.mono{font-family:var(--mono);font-size:12px} .muted{color:var(--ink-3)} .small{font-size:12px}
.recon{font-family:var(--mono);font-size:12px;line-height:1.7} .recon .ok{color:var(--good)} .recon .bad{color:var(--crit);font-weight:700}
.warnrow{color:var(--warn)}
/* drill-down panel */
.panel{position:fixed;top:0;right:0;width:min(720px,100%);height:100vh;background:var(--surface);border-left:1px solid var(--hair);box-shadow:-12px 0 40px rgba(0,0,0,.12);z-index:50;display:flex;flex-direction:column}
.panel header{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel header h3{font-family:var(--display);font-size:18px;color:var(--ink)} .panel .body{overflow:auto;padding:10px 18px 30px}
.panel table{font-size:12.5px} .panel td,.panel th{padding:6px 6px;text-align:left}
.scrim{position:fixed;inset:0;background:rgba(34,20,24,.25);z-index:40}
.login{max-width:380px;margin:120px auto;text-align:center} .login input{width:100%;margin:12px 0}
.sankey text{font-family:var(--ui);font-size:12px;fill:var(--ink)} .sankey .lbl2{fill:var(--ink-3);font-size:11px}
.sankey path{opacity:.55} .sankey path:hover{opacity:.85}
.howto{font-size:12.5px;color:var(--ink-2);line-height:1.55} .howto dt{font-weight:700;color:var(--ink);margin-top:8px} .howto dd{margin-left:0}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin:14px 0 4px;flex-wrap:wrap}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .cnt{font-family:var(--mono);font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:0 6px;margin-left:6px}
.needs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--warn);background:var(--warn-bg);border:1px solid #E7D3A5;border-radius:8px;padding:8px 12px;margin:10px 0}
.needs span{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sk-wrap{width:100%;overflow-x:auto} .sk-wrap svg{display:block;min-width:760px}
.sk-node{cursor:pointer} .sk-link{fill:none;cursor:pointer} .sk-link:hover{stroke-opacity:.85}
.sk-lbl{font-family:var(--ui);font-size:12.5px;fill:var(--ink);font-weight:600} .sk-sub{font-family:var(--ui);font-size:11.5px;fill:var(--ink-3)}
.sk-lbl,.sk-sub{paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}   /* halo keeps labels readable where they sit over a flow */
.sk-cap{display:flex;gap:10px;align-items:baseline;font-size:13px;margin:12px 0 2px} .sk-cap b{color:var(--ink)} .sk-cap span{color:var(--ink-3);font-size:12px} .sk-cap:first-child{margin-top:4px}
.err{background:var(--crit-bg);color:var(--crit);padding:12px;border-radius:8px;margin:20px 0;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-sankey/0.12.3/d3-sankey.min.js"></script>
<script>
/* ======================= CONFIG ======================= */
const CFG = {
  API: "https://script.google.com/macros/s/AKfycbyLH-LgwU3fubggLAFFX6bBn6jPiwSyBlU9oY3rvd2cNdDvfTBtRfy32W_a0BHgBg-k6Q/exec",   /* Apps Script web app /exec URL (deployed 2026-10-21) */
  GHL_LOC: "",   /* filled from the API (config.loc) */
};
/* ======================= STATE ======================= */
const S = { D:null, token:sessionStorage.getItem("dash_token") || "", period:"30", from:null, to:null, cohort:"all", cal:"all", fetched:null, tab:(()=>{ try { return localStorage.getItem("dash_tab") || "sales"; } catch(e){ return "sales"; } })() };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n < 0 ? "-$" : "$") + Math.round(Math.abs(n || 0)).toLocaleString("en-US");
const pct = (n, d) => d ? (100 * n / d).toFixed(1) + "%" : "—";
const num = n => (n || 0).toLocaleString("en-US");
const PT = "America/Los_Angeles";
const TRACKED_FROM = "2026-08-13";   // first webinar with the signup form, Typeform and Zoom all in place
const dayPT = ms => { const p = new Intl.DateTimeFormat("en-CA", { timeZone: PT, year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date(ms)); return p; };
const ptMidnight = day => { const guess = Date.parse(day + "T00:00:00-07:00"); const off = new Intl.DateTimeFormat("en-US",{timeZone:PT,timeZoneName:"longOffset"}).formatToParts(new Date(guess)).find(p=>p.type==="timeZoneName").value; const m = /GMT([+-]\d{2}):(\d{2})/.exec(off); return Date.parse(day + "T00:00:00" + (m ? m[1] + ":" + m[2] : "-07:00")); };
const fmtD = iso => { const d = new Date(iso); return new Intl.DateTimeFormat("en-US",{timeZone:PT,month:"short",day:"numeric"}).format(d); };
const fmtDT = iso => { const d = new Date(iso); return new Intl.DateTimeFormat("en-US",{timeZone:PT,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d); };
const ago = iso => { if (!iso) return "never"; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };

/* ======================= API ======================= */
async function api(params){
  if (!CFG.API) throw new Error("CFG.API is empty: paste the Apps Script /exec URL into index.html");
  const u = new URL(CFG.API); Object.entries(Object.assign({ token:S.token }, params)).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString(), { redirect:"follow" }); const j = await r.json();
  if (!j.ok) throw new Error(j.error || "API error");
  return j;
}
async function load(refresh){
  const j = await api({ action: refresh ? "refresh" : "data" });
  S.D = j.data; S.fetched = new Date(); CFG.GHL_LOC = (S.D.config && S.D.config.loc) || CFG.GHL_LOC;
  sessionStorage.setItem("dash_token", S.token);
  render();
}

/* ======================= PERIOD / FILTERS ======================= */
function range(){
  const now = Date.now();
  if (S.cohort !== "all") { const c = S.D.cohorts.find(x => x.date === S.cohort); const st = Date.parse(c.start), nx = S.D.cohorts[S.D.cohorts.indexOf(c) + 1]; return { from: st, to: nx ? Date.parse(nx.start) : now, label: "Webinar " + fmtD(c.start), cohort: c.date, prior: null }; }
  if (S.period === "custom" && S.from && S.to) { const f = ptMidnight(S.from), t = ptMidnight(S.to) + 864e5; return { from:f, to:t, label: fmtD(new Date(f).toISOString()) + " → " + fmtD(new Date(t - 1).toISOString()), prior: { from: f - (t - f), to: f } }; }
  if (S.period === "dispo") { const f = ptMidnight(S.D.config.dispoFrom); return { from:f, to:now, label:"Since " + fmtD(new Date(f).toISOString()) + " (Dispo form live)", prior:null }; }
  const days = Number(S.period) || 30, f = now - days * 864e5;
  return { from:f, to:now, label:"Last " + days + " days", prior: { from: f - days * 864e5, to: f } };
}
const inR = (iso, r) => { const t = typeof iso === "number" ? iso : Date.parse(iso); return t >= r.from && t < r.to; };
function calOk(b){ return S.cal === "all" ? true : b.kind === "main"; }
/* bookings in the period: booked within the range (booking lens, same as JJ's example: "cohort = people who booked a call in this period") */
function bookingsIn(r){ return S.D.bookings.filter(b => calOk(b) && (r.cohort ? b.cohort === r.cohort : inR(b.bookedAt, r))); }
function heldIn(r){ return bookingsIn(r).filter(b => b.held || b.outcome === "owed"); }
function scaPaidIn(r){ return S.D.payments.filter(p => p.sca && p.status === "paid" && inR(p.t, r)); }

/* ======================= METRICS ======================= */
function metrics(r){
  const B = bookingsIn(r), by = k => B.filter(b => b.outcome === k);
  const showed = by("showed"), noshow = by("noshow"), owed = by("owed"), cancelled = by("cancelled"), upcoming = by("upcoming"), resched = by("rescheduled"), unknown = by("unknown");
  const won = B.filter(b => b.won), qualified = B.filter(b => b.qualified && b.outcome !== "cancelled");
  const happened = showed.length + noshow.length + owed.length;
  const pay = scaPaidIn(r), cash = pay.reduce((s,p) => s + p.net, 0);
  const first = pay.filter(p => p.kind === "first"), inst = pay.filter(p => p.kind === "installment");
  const dealIds = new Set(won.map(b => b.dealId)); const dealsWon = S.D.deals.filter(d => dealIds.has(d.id));
  const cashOnWon = dealsWon.reduce((s,d) => s + d.paid, 0), revenueWon = dealsWon.reduce((s,d) => s + (d.contract != null ? d.contract : d.paid), 0);
  // Rates that divide by shows use only calls on or after the Dispo form go-live, where every result is recorded.
  // Before it, a call only counts as a show when Whop proves a sale, which would inflate close rate.
  const T = trustedStats(B);
  return { B, showed, noshow, owed, cancelled, upcoming, resched, unknown, won, qualified, happened, pay, cash, first, inst,
    firstWon: first.filter(p => !p.deposit), firstDep: first.filter(p => p.deposit), dealsWon, cashOnWon, revenueWon, T,
    showRate: T.happened ? T.showed / T.happened : null, closeRate: T.showed ? T.won / T.showed : null,
    closeBooked: B.length ? won.length / B.length : null, aov: won.length ? cashOnWon / won.length : null,
    dps: T.showed ? T.revenue / T.showed : null, cashPerCall: T.showed ? T.cash / T.showed : null };
}

function trustedStats(B){
  const t = B.filter(b => b.trusted && ["showed","noshow","owed"].includes(b.outcome));
  const sh = t.filter(b => b.outcome === "showed"), w = sh.filter(b => b.won), ids = new Set(w.map(b => b.dealId)), ds = S.D.deals.filter(d => ids.has(d.id));
  return { happened: t.length, showed: sh.length, won: w.length, cash: ds.reduce((s,d) => s + d.paid, 0), revenue: ds.reduce((s,d) => s + (d.contract != null ? d.contract : d.paid), 0) };
}
/* ======================= RENDER ======================= */
function render(){
  const D = S.D; if (!D) return;
  const r = range(), m = metrics(r), pm = r.prior ? metrics(r.prior) : null;
  const delta = (a, b, fmt, invert) => { if (pm == null || b == null || a == null) return ""; const d = b ? (a - b) / Math.abs(b) : (a ? 1 : 0); const cls = Math.abs(d) < .005 ? "flat" : ((d > 0) !== !!invert ? "up" : "dn"); return `<span class="delta ${cls}">${d > 0 ? "▲" : d < 0 ? "▼" : "•"} ${Math.abs(100 * d).toFixed(0)}%</span><span class="muted">vs ${fmt(b)}</span>`; };
  const srcPills = Object.entries(D.sources).map(([k,v]) => `<span class="pill"><i class="dot ${v.ok ? "" : "bad"}"></i>${k} ${v.ok ? ago(v.asOf) : "failed"}</span>`).join("");
  const fails = D.checks.filter(c => !c.ok && c.level !== "warn"), warns = D.checks.filter(c => !c.ok && c.level === "warn");
  const roadWon = D.deals.filter(d => !d.deposit).length, roadDep = D.deals.filter(d => d.deposit).length, N = D.config.roadToN || 250;
  const cohortOpts = D.cohorts.filter(c => c.zoom && c.date >= TRACKED_FROM).slice().reverse().map(c => `<option value="${c.date}" ${S.cohort === c.date ? "selected" : ""}>${fmtD(c.start)}${c.zoom ? "" : " (no Zoom)"}</option>`).join("");
  const recon = (lhs, parts) => { const sum = parts.reduce((s,p) => s + p[1], 0); return `<div><span class="${sum === lhs ? "ok" : "bad"}">${sum === lhs ? "✓" : "✗"}</span> ${parts.map(p => `${p[0]} ${p[1]}`).join(" + ")} = ${sum}${sum === lhs ? "" : " ≠ " + lhs}</div>`; };

  const needs = [];
  const owedN = m.owed.length; if (owedN) needs.push(`<span data-list="b-owed">${owedN} held call${owedN === 1 ? "" : "s"} with no dispo</span>`);
  const offR = D.bookings.filter(b => !b.onRoster && b.outcome !== "cancelled" && Date.parse(b.startAt) >= Date.now() - 7 * 864e5 && Date.parse(b.startAt) <= Date.now() + 30 * 864e5);
  if (offR.length) needs.push(`<span data-list="offroster">${offR.length} booking${offR.length === 1 ? "" : "s"} with someone not on the roster</span>`);
  const unm = D.dispos.filter(x => !x.matched).length; if (unm) needs.push(`<span data-list="dispo-unmatched">${unm} dispo${unm === 1 ? "" : "s"} that match no booking</span>`);
  const tab = (id, label, extra) => `<button role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${label}${extra || ""}</button>`;
  const lensNote = `<div class="muted small" style="margin:-2px 0 8px">Show rate, close rate, $ per show and cash per call use only calls since Oct 15, when the Dispo form started recording every result.</div>`;
  const trustedDelta = (a, b, n) => n ? delta(a, b, v => pct(v, 1)) : "";

  $("#app").innerHTML = `
  <div class="topbar">
    <div><h1>She Creates Academy · Sales</h1><div class="sub">${esc(r.label)}${pm ? " · ▲▼ vs the " + (S.period === "custom" ? "same length before" : "period before") : ""} · updated ${ago(D.builtAt)}</div>

  const P = funnelPeople(r), both = (a, b) => P.filter(p => SK_TEST[a](p) && SK_TEST[b](p)).length;
  const v = {}; SK_NODES.forEach(n => v[n[0]] = P.filter(SK_TEST[n[0]]).length);
  if (!P.length) { host.innerHTML = '<div class="muted">Nobody registered in this period.</div>'; return; }
  const W = Math.max(760, host.clientWidth || 1100), padR = 210;
  const color = { main:"#7A1420", won:"#2F6B4F", skip:"#7FA7DD", wait:"#E3C27A", exit:"#D6CECB" };
  const nameOf = id => SK_NODES.find(x => x[0] === id)[1];
  const subOf = id => { const n = v[id], p = SK_PREV[id]; return num(n) + (p && v[p] ? " · " + Math.round(100 * n / v[p]) + "% of " + nameOf(p).toLowerCase() : ""); };
  host.innerHTML = "";
  SK_PANELS.forEach(pan => {
    const L = pan.links.map(([a, b, kind]) => ({ source:a, target:b, value:both(a, b), kind })).filter(l => l.value > 0);
    const cap = document.createElement("div"); cap.className = "sk-cap"; cap.innerHTML = `<b>${esc(pan.title(v))}</b><span>${esc(pan.sub(v))}</span>`; host.appendChild(cap);
    if (!L.length) { const d = document.createElement("div"); d.className = "muted small"; d.textContent = pan.empty; host.appendChild(d); return; }
    const used = new Set(); L.forEach(l => { used.add(l.source); used.add(l.target); });
    const ids = SK_NODES.filter(n => used.has(n[0])), c0 = Math.min(...ids.map(n => n[2]));
    const nodes = ids.map(n => ({ id:n[0], name:n[1], col:n[2] - c0, kind:n[3], order:SK_NODES.indexOf(n) }));
    const H = pan.h;
    const g = d3.sankey().nodeId(d => d.id).nodeAlign(d => d.col).nodeWidth(16).nodePadding(40).nodeSort((a, b) => a.order - b.order)
      .linkSort((a, b) => (a.source.order - b.source.order) || (a.target.order - b.target.order)).extent([[4, 12], [W - padR, H - 12]]);
    const graph = g({ nodes: nodes.map(d => Object.assign({}, d)), links: L.map(d => Object.assign({}, d)) });
    const svg = d3.select(host).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", "100%").attr("role", "img").attr("aria-label", pan.title(v));
    svg.append("g").selectAll("path").data(graph.links).join("path").attr("class", "sk-link").attr("d", d3.sankeyLinkHorizontal())
      .attr("stroke", d => color[d.kind]).attr("stroke-opacity", d => d.kind === "exit" ? .6 : d.kind === "skip" || d.kind === "wait" ? .5 : .38).attr("stroke-width", d => Math.max(2, d.width))
      .on("click", (e, d) => showList("sk|" + d.source.id + ">" + d.target.id))
      .append("title").text(d => `${d.source.name} → ${d.target.name}: ${num(d.value)}`);
    const nd = svg.append("g").selectAll("g").data(graph.nodes).join("g").attr("class", "sk-node").on("click", (e, d) => showList("sk|" + d.id));
    nd.append("rect").attr("x", d => d.x0).attr("y", d => d.y0).attr("width", d => d.x1 - d.x0).attr("height", d => Math.max(3, d.y1 - d.y0)).attr("rx", 2).attr("fill", d => color[d.kind]);
    nd.append("title").text(d => `${d.name}: ${subOf(d.id)}`);
    const lx = d => d.x1 + 8, ly = d => Math.min(Math.max(d.y0, 12), H - 34);   // label hugs the top of its bar, never leaves the canvas
    nd.append("text").attr("class", "sk-lbl").attr("x", lx).attr("y", d => ly(d) + 5).attr("dy", ".35em").text(d => d.name);
    nd.append("text").attr("class", "sk-sub").attr("x", lx).attr("y", d => ly(d) + 21).attr("dy", ".35em").text(d => subOf(d.id));
  });
}
function texts(r){
  const T = S.D.texts; if (!T) return `<div class="muted">No text data yet.</div>`;
  const rows = T.rows.filter(x => inR(ptMidnight(x.day), { from: r.from - 864e5, to: r.to }));
  const grp = (keyFn, label) => { const g = {}; rows.forEach(x => { const k = keyFn(x); const a = g[k] = g[k] || { k, sent:0, delivered:0, failed:0, replied:0, med:[] }; a.sent += x.sent; a.delivered += x.delivered; a.failed += x.failed; a.replied += x.replied; if (x.replyMedianMin != null) a.med.push(x.replyMedianMin); });
    return Object.values(g).sort((a,b) => b.sent - a.sent).map(a => `<tr><td>${esc(label(a.k))}</td><td>${num(a.sent)}</td><td>${pct(a.delivered, a.sent)}</td><td>${pct(a.failed, a.sent)}</td><td>${pct(a.replied, a.sent)}</td><td>${a.med.length ? Math.round(a.med.sort((x,y)=>x-y)[Math.floor(a.med.length/2)]) + " min" : "—"}</td></tr>`).join(""); };
  const users = Object.assign({}, S.D.config.users || {}, S.D.config.setters || {}, S.D.config.roster || {});
  const who = x => x.source === "workflow" ? "Automation (workflows)" : (users[x.userId] || (x.userId ? "former user " + x.userId.slice(0,6) : "Human (no user id)"));
  return `<div class="grid g2"><div><table><tr><th>By provider × sender</th><th>Sent</th><th>Delivered</th><th>Failed</th><th>Replied</th><th>Median reply</th></tr>
    ${grp(x => x.provider + "|" + (x.source === "workflow" ? "automation" : "human"), k => ({ lc:"LC Phone", sendblue:"SendBlue iMessage", custom:"Custom provider" }[k.split("|")[0]] || k.split("|")[0]) + " · " + k.split("|")[1])}</table></div>
    <div><table><tr><th>By rep</th><th>Sent</th><th>Delivered</th><th>Failed</th><th>Replied</th><th>Median reply</th></tr>${grp(who, k => k)}</table></div></div>
  <div class="muted small" style="margin-top:6px">${num(T.count)} messages stored${T.backfillDone ? "" : " (history still backfilling)"}. Delivered / failed is the status GHL reports; pending statuses count as neither. Automation = sent by a workflow; everything else was a person.</div>`;
}

/* ======================= DRILL-DOWN LISTS ======================= */
function listFor(key){
  const D = S.D, r = range(), m = metrics(r), P = D.people, name = pid => (P[pid] && P[pid].name) || "(no name)";
  const ghl = pid => P[pid] && P[pid].contactId && CFG.GHL_LOC ? `https://app.gohighlevel.com/v2/location/${CFG.GHL_LOC}/contacts/detail/${P[pid].contactId}` : "";
  const bRow = b => ({ name: name(b.pid), when: fmtDT(b.startAt), booked: fmtDT(b.bookedAt), calendar: b.cal, closer: b.closer, outcome: b.outcome + (b.showedBy === "whop" ? " (proven by Whop)" : "") + (b.dispoOutcome ? " · " + b.dispoOutcome : ""), qualified: b.qualified ? "yes" : "", won: b.won ? (b.dealDeposit ? "plan " : "PIF ") + money(b.dealPaid) : (b.reportedNotBanked ? "reported, not banked" : ""), link: ghl(b.pid) });
  const pRow = p => ({ name: p.name || name(p.pid), when: fmtDT(p.at), amount: money(p.net), kind: p.kind + (p.deposit ? " (plan)" : ""), product: p.productName, method: p.method || "", link: ghl(p.pid) });
  const dRow = d => ({ name: d.name || name(d.pid), started: fmtDT(d.anchorAt), paid: money(d.paid), contract: d.contract != null ? money(d.contract) : "—", remaining: d.remaining != null ? money(d.remaining) : "no schedule", type: d.deposit ? "plan" : "paid in full", link: ghl(d.pid) });
  const [k, arg] = key.split("|");
  const B = m.B;
  const byO = o => B.filter(b => b.outcome === o);
  const map = {
    "b-all": ["Booked", B, bRow], "b-showed": ["Showed", byO("showed"), bRow], "b-won": ["Won (banked)", B.filter(b => b.won), bRow], "b-qualified": ["Qualified booked", m.qualified, bRow],
    "b-upcoming": ["Upcoming", byO("upcoming"), bRow], "b-cancelled": ["Cancelled", byO("cancelled"), bRow], "b-noshow": ["No-show", byO("noshow"), bRow], "b-owed": ["Owed: held, no dispo filed", byO("owed"), bRow],
    "b-unknown": ["Unknown (before the Dispo form)", byO("unknown"), bRow], "b-reported": ["Reported won on the dispo form, no Whop money", B.filter(b => b.reportedNotBanked), bRow],
    "pay-all": ["SCA payments in the period", m.pay, pRow], "pay-first": ["First payments (new deals)", m.first, pRow], "pay-inst": ["Installments on earlier deals", m.inst, pRow],
    "deals-open": ["Plans with money still to collect", D.deals.filter(d => d.remaining > 0), dRow], "deals-pif": ["Paid in full, all-time", D.deals.filter(d => !d.deposit), dRow], "deals-plan": ["Payment plans started, all-time", D.deals.filter(d => d.deposit), dRow],
  };
  if (map[k]) return [map[k][0], map[k][1].map(map[k][2])];
  if (k.startsWith("o-")) { const o = k.slice(2); const held = B.filter(b => ["showed","noshow","owed"].includes(b.outcome) && outcomeClass(b) === o); return ["Outcome: " + (OUT.find(x => x[0] === o) || [o,o])[1], held.map(bRow)]; }
  if (k.startsWith("c-")) { const what = k.slice(2); let L = B.filter(b => arg === "all" || (b.closer || "(no closer)") === arg); if (what === "showed") L = L.filter(b => b.outcome === "showed"); if (what === "won") L = L.filter(b => b.won); if (what === "qualified") L = L.filter(b => b.qualified && b.outcome !== "cancelled"); if (what === "owed") L = L.filter(b => b.outcome === "owed"); return [arg + " · " + what, L.map(bRow)]; }
  if (k.startsWith("w-")) { const what = k.slice(2), c = arg;
    if (what === "reg") { const seen = new Set(); return ["Registered · " + c, D.registrations.filter(x => x.cohort === c && !seen.has(x.pid) && seen.add(x.pid)).map(x => ({ name: name(x.pid), when: fmtDT(x.at), source: x.source, first: x.first ? "first time" : "repeat", link: ghl(x.pid) }))]; }
    if (what === "att") { const a = D.attendance[c]; return ["Watched live · " + c + " (" + a.unmatched + " unmatched names not listed)", a.matched.map(x => ({ name: name(x.pid), minutes: x.minutes, matched: x.by, link: ghl(x.pid) }))]; }
    if (what === "app" || what === "qual") { const seen = new Set(); return [(what === "qual" ? "Can invest · " : "Applied · ") + c, D.applications.filter(a => a.cohort === c && (what === "app" || a.qualification === "Qualified")).sort((a,b) => Date.parse(b.at) - Date.parse(a.at)).filter(a => !seen.has(a.pid) && seen.add(a.pid)).map(a => ({ name: name(a.pid), when: fmtDT(a.at), qualification: a.qualification, source: a.source, link: ghl(a.pid) }))]; }
    const L = D.bookings.filter(b => b.cohort === c && calOk(b)); return [what + " · " + c, (what === "showed" ? L.filter(b => b.outcome === "showed") : what === "won" ? L.filter(b => b.won) : L).map(bRow)]; }
  if (k === "sk") { const P2 = funnelPeople(r), row = p => ({ name: name(p.pid), webinar: p.cohort ? fmtD(p.cohort + "T12:00:00-07:00") : "", watched: p.attended ? "yes" : "", applied: p.applied ? "yes" : "", canInvest: p.qualified ? "yes" : "", booked: p.booked ? "yes" : "", showed: p.showed ? "yes" : "", closed: p.won ? "yes" : "", link: ghl(p.pid) });
    const nm = id => SK_NODES.find(x => x[0] === id)[1];
    if (arg.includes(">")) { const [a1, b1] = arg.split(">"); const fa = SK_TEST[a1], fb = SK_TEST[b1]; return [nm(a1) + " → " + nm(b1), P2.filter(p => fa(p) && fb(p)).map(row)]; }
    return [nm(arg), P2.filter(SK_TEST[arg]).map(row)]; }
  if (k === "offroster") { const L = D.bookings.filter(b => !b.onRoster && b.outcome !== "cancelled" && Date.parse(b.startAt) >= Date.now() - 7 * 864e5 && Date.parse(b.startAt) <= Date.now() + 30 * 864e5); return ["Bookings with someone not on the roster", L.map(bRow)]; }
  if (k === "dispo-unmatched") return ["Dispos that match no booking", D.dispos.filter(x => !x.matched).map(x => ({ name: x.prospect, call: x.date, closer: x.closer, outcome: x.outcome, link: "" }))];
  if (k.startsWith("s-")) { const P2 = funnelPeople(r), parts = k.split("-"); const test = [p => true, p => p.attended, p => p.applied, p => p.qualified, p => p.booked, p => p.showed, p => p.won];
    const names = ["Registered", "Watched live", "Applied", "Can invest", "Booked a call", "Showed", "Closed"];
    const darkTo = (p, n) => { for (let i = 1; i <= n; i++) if (!test[i](p)) return false; return true; };
    const blueTo = (p, n) => { if (n < 1 || p.attended) return false; for (let i = 2; i <= n; i++) if (!test[i](p)) return false; return true; };
    const row = p => ({ name: name(p.pid), cohort: p.cohort, watched: p.attended ? "yes" : "", applied: p.applied ? "yes" : "", canInvest: p.qualified ? "yes" : "", booked: p.booked ? "yes" : "", showed: p.showed ? "yes" : "", closed: p.won ? "yes" : "", link: ghl(p.pid) });
    if (parts[1] === "drop") { const n = Number(parts[2]); return ["Watched live, stopped before: " + names[n + 1], P2.filter(p => darkTo(p, n) && !test[n + 1](p)).map(row)]; }
    if (parts[1] === "bdrop") { const n = Number(parts[2]); return ["Did not watch live, stopped before: " + names[n + 1], P2.filter(p => blueTo(p, n) && !test[n + 1](p)).map(row)]; }
    if (parts[1] === "skip") { const n = Number(parts[2]); return ["Did not watch live, reached: " + names[n], P2.filter(p => blueTo(p, n)).map(row)]; }
    const n = Number(parts[1]); return [names[n] + (n ? " (watched live)" : ""), P2.filter(p => darkTo(p, n)).map(row)]; }
  return [key, []];
}
function showList(key){
  const [title, rows] = listFor(key);
  const cols = rows.length ? Object.keys(rows[0]).filter(c => c !== "link") : [];
  const csv = () => { const lines = [cols.join(",")].concat(rows.map(r => cols.map(c => '"' + String(r[c] == null ? "" : r[c]).replace(/"/g, '""') + '"').join(","))); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type:"text/csv" })); a.download = title.replace(/[^a-z0-9]+/gi, "-") + ".csv"; a.click(); };
  const el = document.createElement("div"); el.innerHTML = `<div class="scrim" id="scrim"></div><div class="panel" id="panel"><header><h3>${esc(title)} <span class="muted" style="font-size:13px">${rows.length}</span></h3><div><button class="btn" id="csv">CSV</button> <button class="btn" id="close">Close</button></div></header>
    <div class="body">${rows.length ? `<table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${rows.map(r => `<tr>${cols.map(c => `<td>${c === "name" && r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r[c])}</a>` : esc(r[c])}</td>`).join("")}</tr>`).join("")}</table>` : `<div class="muted">Nothing in this list.</div>`}</div></div>`;
  document.body.appendChild(el);
  const close = () => el.remove(); el.querySelector("#scrim").onclick = close; el.querySelector("#close").onclick = close; el.querySelector("#csv").onclick = csv;
}

/* ======================= HOW TO READ ======================= */
const HOWTO = `<dl>
<dt>Where every number comes from</dt><dd>Bookings and call outcomes: GHL calendars + the Call Disposition form. Cash: Whop, SCA products only (Kora, Español and the old low-ticket offer are excluded). Applications: Typeform. Registrations: the GHL signup form. Watched live: Zoom participant reports. Texts: GHL conversations (LC Phone and SendBlue both land there).</dd>
<dt>Period</dt><dd>Booked = calls booked in the period, and showed / won follow those bookings wherever the call lands. Cash = payments that landed in the period, whoever they came from. Picking a webinar replaces the period with that night's cohort.</dd>
<dt>Won</dt><dd>The person started an SCA deal on Whop between booking and 30 days after the call. A dispo "Closed - Won" with no Whop money is listed as "reported, not banked" and does not count.</dd>
<dt>Owed vs Unknown</dt><dd>Owed = a call since 10/15 that happened with no status and no dispo form. Unknown = the same before 10/15, when nobody marked calls; that history is shown, not judged.</dd>
<dt>Click anything</dt><dd>Every tile, bar, segment and scorecard number opens the list of people behind it, with GHL links and a CSV button. If a number looks wrong, open its list.</dd>
<dt>Refresh</dt><dd>Data refreshes itself every 5 minutes. "Refresh data" pulls right now. Zoom reports exist only after a stream ends.</dd>
</dl>`;

/* ======================= BIND ======================= */
function bind(){
  document.querySelectorAll("[data-list]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); showList(el.getAttribute("data-list")); }));
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; try { localStorage.setItem("dash_tab", S.tab); } catch(e){} render(); }));
  $("#cohort").onchange = e => { S.cohort = e.target.value; render(); };
  $("#period").onchange = e => { S.period = e.target.value; if (S.period !== "custom") render(); else $("#custom").hidden = false; };
  const custom = () => { S.from = $("#from").value; S.to = $("#to").value; if (S.from && S.to) render(); }; $("#from").onchange = custom; $("#to").onchange = custom;
  if ($("#cal")) $("#cal").onchange = e => { S.cal = e.target.value; render(); };
  $("#howto").onclick = () => { $("#howtoBox").hidden = !$("#howtoBox").hidden; };
  $("#refresh").onclick = async () => { $("#refresh").textContent = "Refreshing…"; try { await load(true); } catch (err) { showError(err); } };
}
window.addEventListener("resize", () => { if (S.D && S.tab === "webinars") drawSankey(range()); });
function showError(err){ const d = document.createElement("div"); d.className = "err"; d.textContent = String(err.message || err); $("#app").prepend(d); }
function loginView(msg){
  $("#app").innerHTML = `<div class="login card"><h1 style="font-size:22px">SCA Sales Dashboard</h1><div class="sub">Enter the team password</div><input type="password" id="pw" autofocus><button class="btn primary" id="go">Open</button>${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>`;
  const go = async () => { S.token = $("#pw").value.trim(); try { $("#go").textContent = "Loading…"; await load(false); } catch (err) { loginView(err.message); } };
  $("#go").onclick = go; $("#pw").onkeydown = e => { if (e.key === "Enter") go(); };
}
(async () => {
  if (location.hash.startsWith("#local")) { const t = location.hash.slice(6); if (t) S.tab = t; /* harness preview: python3 -m http.server in sales-dashboard/, open index.html#local */
    try { const r = await fetch("api/.data/dash-data.json"); S.D = await r.json(); CFG.GHL_LOC = S.D.config.loc || ""; render(); } catch (e) { showError(e); } return; }
  if (!S.token) return loginView("");
  try { await load(false); } catch (err) { loginView(err.message); }
  setInterval(() => { if (document.visibilityState === "visible" && S.D) load(false).catch(() => {}); }, 5 * 60 * 1000);
})();
</script>
