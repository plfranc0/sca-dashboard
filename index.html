<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCA Growth Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📊</text></svg>">
<style>
:root{
  --ground:#FDF9F4; --surface:#FFFFFF; --surface-2:#F7EFEA; --surface-3:#F1E4DD;
  --ink:#221418; --ink-2:#4C3A3D; --ink-3:#8A7477;
  --accent:#7A1420; --head-bg:#7A1420; --head-ink:#FFFFFF;
  --hair:#E4D6CF; --hair-2:#F0E4DE;
  --c1:#A32235; --c2:#0077A8; --c3:#B57614; --c4:#6B4A8F;
  --good:#2F6B4F; --warn:#9A6B12; --crit:#B3261E;
  --good-bg:#E6F0EA; --warn-bg:#F6EEDD; --crit-bg:#F8E6E4;
  --shadow:0 1px 2px rgba(34,20,24,.05), 0 8px 24px -14px rgba(34,20,24,.16);
  --display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17110F; --surface:#221A19; --surface-2:#2C2221; --surface-3:#352827;
    --ink:#F4EBE6; --ink-2:#C4B0AC; --ink-3:#8E7B78;
    --accent:#DC6076; --head-bg:#4A1F27; --head-ink:#F7E4E6;
    --hair:#3A2B2B; --hair-2:#2E2323;
    --c1:#DC6076; --c2:#2E93CC; --c3:#C2871A; --c4:#9070C6;
    --good:#5FAF87; --warn:#D2A03F; --crit:#E0706A;
    --good-bg:#1D2A24; --warn-bg:#2C2418; --crit-bg:#2E1E1D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#17110F; --surface:#221A19; --surface-2:#2C2221; --surface-3:#352827;
  --ink:#F4EBE6; --ink-2:#C4B0AC; --ink-3:#8E7B78;
  --accent:#DC6076; --head-bg:#4A1F27; --head-ink:#F7E4E6;
  --hair:#3A2B2B; --hair-2:#2E2323;
  --c1:#DC6076; --c2:#2E93CC; --c3:#C2871A; --c4:#9070C6;
  --good:#5FAF87; --warn:#D2A03F; --crit:#E0706A;
  --good-bg:#1D2A24; --warn-bg:#2C2418; --crit-bg:#2E1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground); color:var(--ink-2); font-family:var(--ui); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
.wrap{max-width:1320px; margin:0 auto; padding:0 20px 80px}

header.top{border-bottom:1px solid var(--hair); background:var(--surface); position:sticky; top:0; z-index:20}
.top-in{max-width:1320px; margin:0 auto; padding:13px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:1px; margin-right:auto}
.brand h1{font-family:var(--display); font-size:20px; font-weight:600; color:var(--ink); margin:0; letter-spacing:-.01em}
.brand .sub{font-size:11.5px; color:var(--ink-3)}
.status{display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-3)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--crit)}
.range{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-3)}
select,input[type="date"]{font-family:var(--mono); font-size:12px; color:var(--ink); background:var(--surface); border:1px solid var(--hair); border-radius:5px; padding:5px 8px; cursor:pointer}
select:focus-visible,input[type="date"]:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
input[type="date"]{color-scheme:light}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) input[type="date"]{color-scheme:dark} }
:root[data-theme="dark"] input[type="date"]{color-scheme:dark}
.ghost{font-family:var(--ui); font-size:12px; font-weight:600; color:var(--ink-2); background:none; border:1px solid var(--hair); border-radius:5px; padding:6px 11px; cursor:pointer; text-decoration:none; display:inline-block}
.ghost:hover{border-color:var(--accent); color:var(--accent)}

.tabbar{border-bottom:1px solid var(--hair); background:var(--surface)}
.tabs{display:flex; max-width:1320px; margin:0 auto; padding:0 20px; flex-wrap:wrap}
.tab{appearance:none; background:none; border:none; cursor:pointer; font-family:var(--ui); font-size:13px; font-weight:600; color:var(--ink-3); padding:13px 2px; margin-right:24px; border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.page{padding-top:22px; display:flex; flex-direction:column; gap:14px}
.page[hidden]{display:none}
.row{display:grid; gap:14px}
.r3{grid-template-columns:repeat(3,1fr)}
.r2{grid-template-columns:1fr 1fr}
.r21{grid-template-columns:2fr 1fr}
@media(max-width:1080px){.r3{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.r3,.r2,.r21{grid-template-columns:1fr}}

/* ---- panel: title bar + grid of labelled metric cells ---- */
.panel{background:var(--surface); border:1px solid var(--hair); border-radius:8px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column}
.panel-head{background:var(--head-bg); color:var(--head-ink); font-family:var(--display); font-size:15.5px; font-weight:600; text-align:center; padding:11px 14px; letter-spacing:.01em}
.panel-body{display:grid; gap:1px; background:var(--hair); flex:1}
.pb1{grid-template-columns:1fr}
.pb2{grid-template-columns:1fr 1fr}
.pb3{grid-template-columns:repeat(3,1fr)}
.pb4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.pb4{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.pb3{grid-template-columns:1fr 1fr}}
.cell{background:var(--surface); display:flex; flex-direction:column; min-width:0}
.cell-label{background:var(--surface-2); padding:7px 12px; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cell-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:2px; flex:1}
.cell-val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:23px; font-weight:600; color:var(--ink); line-height:1.1; letter-spacing:-.02em}
.cell-val.sm{font-size:18px}
.cell-sub{font-size:11px; color:var(--ink-3); line-height:1.35}
.cell.na .cell-val{color:var(--ink-3); font-size:15px; font-weight:500}
.cell.good .cell-val{color:var(--good)}
.cell.bad .cell-val{color:var(--crit)}
.delta{font-family:var(--mono); font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:3px}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-3)}

/* progress meter for target */
.meter{height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:6px}
.meter span{display:block; height:100%; border-radius:3px; background:var(--accent)}

.card{background:var(--surface); border:1px solid var(--hair); border-radius:8px; padding:16px 18px; box-shadow:var(--shadow)}
.chart-head{display:flex; flex-direction:column; gap:2px; margin-bottom:14px}
.chart-title{font-size:13.5px; font-weight:700; color:var(--ink)}
.chart-note{font-size:11.5px; color:var(--ink-3)}
svg{display:block; width:100%; height:auto; overflow:visible}
.gridline{stroke:var(--hair-2); stroke-width:1}
.axis-txt{font-family:var(--mono); font-size:9.5px; fill:var(--ink-3)}
.dlabel{font-family:var(--mono); font-size:9.5px; font-weight:600; fill:var(--ink-2)}
.bar{transition:opacity .12s} .bar:hover{opacity:.72}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:11px}
.lg{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2)}
.sw{width:10px; height:10px; border-radius:2px; flex:none}
.sw.line{height:3px; width:14px; border-radius:2px}

.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:640px}
th,td{padding:9px 13px; text-align:right; border-bottom:1px solid var(--hair-2); white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2)}
td{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-2)}
td:first-child{font-family:var(--ui); color:var(--ink); font-weight:600}
td.l{font-family:var(--ui); white-space:normal; min-width:250px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
.pill{display:inline-block; font-family:var(--ui); font-size:10px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:20px}
.pill.ok{background:var(--good-bg); color:var(--good)}
.pill.chk{background:var(--warn-bg); color:var(--warn)}
.pill.bad{background:var(--crit-bg); color:var(--crit)}

.note{border:1px solid var(--hair); border-left:3px solid var(--accent); background:var(--surface); border-radius:6px; padding:14px 17px; font-size:13px; display:flex; flex-direction:column; gap:6px}
.note strong{color:var(--ink)}
.note.warn{border-left-color:var(--warn)}
.banner{border-radius:8px; padding:16px 18px; font-size:13.5px; background:var(--crit-bg); border:1px solid var(--crit); color:var(--crit)}
.banner strong{display:block; font-size:15px; margin-bottom:4px}
.loading{padding:80px 0; text-align:center; color:var(--ink-3); font-size:14px}
.skel{display:inline-block; width:180px; height:10px; border-radius:5px; background:var(--hair); animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
#health-pop{margin-top:18px; display:flex; flex-direction:column; gap:14px}
#health-pop[hidden]{display:none}
#health-pill.warn{border-color:var(--warn); color:var(--warn)}
#health-pill.ok{color:var(--good)}
footer{margin-top:30px; padding-top:16px; border-top:1px solid var(--hair); font-size:11.5px; color:var(--ink-3); display:flex; gap:16px; flex-wrap:wrap}
footer a{color:var(--ink-3)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>She Creates Academy</h1>
      <span class="sub">Growth dashboard &middot; live from the SCA Master Tracker</span>
    </div>
    <span class="status" id="status"><span class="dot" id="dot"></span><span id="status-txt">Loading&hellip;</span></span>
    <button class="ghost" id="health-pill" aria-expanded="false" title="Data quality checks" hidden>Data &#10003;</button>
    <span class="range">
      <select id="preset" aria-label="Date range preset">
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="60" selected>Last 60 days</option>
        <option value="90">Last 90 days</option>
        <option value="all">All time</option>
        <option value="custom">Custom&hellip;</option>
      </select>
      <input type="date" id="from" aria-label="From date">
      <span aria-hidden="true">&rarr;</span>
      <input type="date" id="to" aria-label="To date">
    </span>
    <a class="ghost" id="sheet-link" href="#" target="_blank" rel="noopener">Open sheet</a>
  </div>
</header>

<div class="tabbar">
  <div class="tabs" role="tablist" aria-label="Dashboard pages">
    <button class="tab" role="tab" id="tab-overview" aria-controls="page-overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" id="tab-team"     aria-controls="page-team"     aria-selected="false">Team KPIs</button>
    <button class="tab" role="tab" id="tab-webinars" aria-controls="page-webinars" aria-selected="false">Webinars</button>
  </div>
</div>

<div class="wrap">
  <div id="boot" class="loading"><div class="skel"></div><div style="margin-top:14px">Reading the Master Tracker&hellip;</div></div>
  <div id="fail" hidden></div>
  <div id="stale" hidden style="margin-top:18px"></div>
  <section id="health-pop" hidden></section>
  <main id="app" hidden>
    <section class="page" id="page-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
    <section class="page" id="page-team" role="tabpanel" aria-labelledby="tab-team" hidden></section>
    <section class="page" id="page-webinars" role="tabpanel" aria-labelledby="tab-webinars" hidden></section>
    <footer>
      <span id="foot-fetch"></span>
      <span>Weeks run Thursday to Wednesday.</span>
      <a href="#" id="foot-sheet" target="_blank" rel="noopener">SCA Master Tracker</a>
    </footer>
  </main>
</div>

<script>
"use strict";

const SID = "1AaqCLsqpdhzktzE002UvN1aBGsMXajksak_w8qL_tos";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SID + "/edit";
const S = { ws:[], cs:[], ss:[], dh:[], mo:[], wd:[], tg:{}, cl:[], po:[], weeks:[], fromD:null, toD:null, wsel:null, fetched:null };

/* ---------------- data ---------------- */
async function gviz(tab){
  /* headers=1 forces row 1 to be the header row — without it, all-text tabs
     (Webinar Detail, Targets and Spend) come back with A/B/C column ids. */
  const url = "https://docs.google.com/spreadsheets/d/" + SID +
              "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(tab) + "&t=" + Date.now();
  const res = await fetch(url);
  if(!res.ok) throw new Error("Tab “" + tab + "”: HTTP " + res.status + ". The sheet may no longer be shared with anyone-with-the-link.");
  const text = await res.text();
  const open = text.indexOf("setResponse("), close = text.lastIndexOf(")");
  if(open === -1 || close === -1) throw new Error("Tab “" + tab + "” returned an unexpected response. Check the tab still exists under that exact name.");
  const d = JSON.parse(text.slice(open + 12, close));
  if(d.status !== "ok") throw new Error("Tab “" + tab + "”: " + JSON.stringify(d.errors || d.status));
  const cols = d.table.cols.map(c => (c.label || c.id || "").trim());
  return d.table.rows.map(r => {
    const o = {};
    cols.forEach((name, i) => { const cell = r.c[i]; o[name] = cell ? cell.v : null; });
    return o;
  });
}
const n = v => (typeof v === "number" && isFinite(v)) ? v : 0;
const has = v => v !== null && v !== undefined && v !== "";

/* ---------------- format ---------------- */
const money = v => (v === null || v === undefined || !isFinite(v)) ? "—" : "$" + Math.round(v).toLocaleString("en-US");
const num   = v => (v === null || v === undefined || !isFinite(v)) ? "—" : Math.round(v).toLocaleString("en-US");
const pct   = v => (v === null || v === undefined || !isFinite(v)) ? "—" : (v*100).toFixed(1) + "%";
const pct0  = v => (v === null || v === undefined || !isFinite(v)) ? "—" : Math.round(v*100) + "%";
const wkShort = w => { const p = String(w).split("-"); if(p.length !== 3) return w;
  return MON[+p[1]-1] + " " + (+p[2]); };
/* gviz returns real date cells as "Date(2026,7,21)" (month 0-based). */
const gvDate = v => { const m = /^Date\((\d+),(\d+),(\d+)/.exec(String(v));
  return m ? m[1]+"-"+String(+m[2]+1).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0") : String(v); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Full label for the range pickers: "Thu Aug 13 – Wed Aug 19" */
const wkRange = w => { const p = String(w).split("-"); if(p.length !== 3) return w;
  const e = weekEnd(w).split("-");
  return "Thu " + MON[+p[1]-1] + " " + (+p[2]) + " – Wed " + MON[+e[1]-1] + " " + (+e[2]); };
const moLabel = m => { const p = String(m).split("-"); return p.length === 2 ? MON[+p[1]-1] + " " + p[0] : m; };
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------------- math ---------------- */
const sum = (rows, f) => rows.reduce((s,r) => s + n(f(r)), 0);
const div = (a,b) => (b > 0 ? a/b : null);
/* The pickers select calendar DATES; the data is Thursday-anchored WEEKS.
   A week is in range when its Thu–Wed span overlaps the selected dates. */
const inRange = w => weekEnd(w) >= S.fromD && String(w) <= S.toD;
const wsRows = () => S.ws.filter(r => inRange(r["Week (Thu)"]));
const csRows = () => S.cs.filter(r => inRange(r["Week (Thu)"]));
const ssRows = () => S.ss.filter(r => inRange(r["Week (Thu)"]));

/* Comparison period: the same number of weeks immediately before the selection. */
function prevRows(){
  const sel = wsRows().map(r => r["Week (Thu)"]);
  if(!sel.length) return [];
  const i = S.weeks.indexOf(sel[0]);
  if(i <= 0) return [];
  const prevWeeks = S.weeks.slice(Math.max(0, i - sel.length), i);
  return S.ws.filter(r => prevWeeks.indexOf(r["Week (Thu)"]) > -1);
}

/* Speed to Dial is a rolling 28-day window in the Apps Script, so appointment
   metrics vanish for older weeks. Printing 0% there would read as "nobody
   dialed fast" instead of "the data aged out". */
const STD_WINDOW_DAYS = 28;
function isoShift(days){
  const d = new Date(Date.now() + days*86400000);
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0");
}
function weekEnd(w){
  const p = String(w).split("-"); if(p.length !== 3) return w;
  const d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2] + 6));
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0");
}
const agedOut = w => weekEnd(w) < isoShift(-STD_WINDOW_DAYS);

/* ---------------- cells ---------------- */
function cell(label, val, opt){
  opt = opt || {};
  const cls = opt.na ? " na" : (opt.tone ? " " + opt.tone : "");
  return '<div class="cell'+cls+'">'
    + '<div class="cell-label" title="'+esc(label)+'">'+esc(label)+'</div>'
    + '<div class="cell-body">'
    + '<span class="cell-val'+(opt.sm?" sm":"")+'">'+val+'</span>'
    + (opt.sub ? '<span class="cell-sub">'+opt.sub+'</span>' : "")
    + (opt.meter !== undefined && opt.meter !== null
        ? '<div class="meter"><span style="width:'+Math.max(0,Math.min(100,opt.meter*100)).toFixed(1)+'%"></span></div>' : "")
    + '</div></div>';
}
function panel(title, cells, cols){
  return '<div class="panel"><div class="panel-head">'+esc(title)+'</div>'
    + '<div class="panel-body pb'+(cols||2)+'">'+cells.join("")+'</div></div>';
}
function delta(cur, prev, fmt, invert){
  if(prev === null || prev === undefined || !isFinite(prev) || prev === 0) return "";
  if(cur === null || !isFinite(cur)) return "";
  const change = (cur - prev)/Math.abs(prev);
  if(Math.abs(change) < 0.005) return '<span class="delta flat">no change vs prior</span>';
  const better = invert ? change < 0 : change > 0;
  return '<span class="delta '+(better?"up":"down")+'">'+(change>0?"▲":"▼")+' '
    + Math.abs(change*100).toFixed(1) + '% vs prior</span>';
}
function naCell(label, why){
  return cell(label, "Not tracked", {na:true, sub:why});
}

/* ---------------- OVERVIEW ---------------- */
function renderOverview(){
  const R = wsRows(), P = prevRows(), cats = R.map(r => r["Week (Thu)"]);

  const cash    = sum(R,r=>r["Cash Collected"]),      pCash  = sum(P,r=>r["Cash Collected"]);
  const rev     = sum(R,r=>r["Revenue Contracted"]),  pRev   = sum(P,r=>r["Revenue Contracted"]);
  const closes  = sum(R,r=>r["Closes"]),              pCloses= sum(P,r=>r["Closes"]);
  const held    = sum(R,r=>r["Calls Held"]),          pHeld  = sum(P,r=>r["Calls Held"]);
  const due     = sum(R,r=>r["Calls Due"]),           pDue   = sum(P,r=>r["Calls Due"]);
  const reg     = sum(R,r=>r["Registered"]),          pReg   = sum(P,r=>r["Registered"]);
  const att     = sum(R,r=>r["Attended Live"]),       pAtt   = sum(P,r=>r["Attended Live"]);
  const apps    = sum(R,r=>r["Applications"]),        pApps  = sum(P,r=>r["Applications"]);
  const booked  = sum(R,r=>r["Calls Booked (stream day)"]), pBooked = sum(P,r=>r["Calls Booked (stream day)"]);
  const offers  = sum(R,r=>r["Offers Pitched"]);
  const pif     = sum(R,r=>r["PIF Deals"]), plan = sum(R,r=>r["Plan Deals"]);
  const canc    = sum(R,r=>r["Cancelled Calls"]), cancTracked = sum(R,r=>r["Cancel Tracked Calls"]);
  const resch   = sum(R,r=>r["Rescheduled Calls"]);

  /* current calendar month from the Monthly tab */
  const mo = S.mo.filter(r => has(r["Month"]));
  const cur = mo[0] || null;                       /* sorted newest first */
  const target = cur && has(cur["Target"]) ? n(cur["Target"]) : null;
  const moCash = cur ? n(cur["Cash Collected"]) : null;

  /* straight-line pace projection, only for the real current month, and not
     in the first two days when one deal makes the line meaningless */
  const nowD = new Date();
  const curKey = nowD.getFullYear() + "-" + String(nowD.getMonth()+1).padStart(2,"0");
  let pace = null;
  if(cur && String(cur["Month"]) === curKey && moCash !== null && nowD.getDate() >= 3){
    const dim = new Date(nowD.getFullYear(), nowD.getMonth()+1, 0).getDate();
    pace = moCash / nowD.getDate() * dim;
  }

  let h = "";

  /* ---- row 1: revenue / webinar funnel / sales calls ---- */
  h += '<div class="row r3">';

  h += panel("Revenue", [
    cell("Monthly revenue target", target === null ? "Not set" : money(target),
      target === null ? {na:true, sub:"Set it on the Targets and Spend tab"} : {sub:"cash collected, per calendar month"}),
    cell("Current month revenue", moCash === null ? "—" : money(moCash),
      {sub: (cur ? esc(moLabel(cur["Month"])) + " &middot; " + num(cur["Closes"]) + " closes" : "")
            + (pace !== null ? " &middot; on pace for " + money(pace) : ""),
       meter: (target && moCash !== null) ? moCash/target : null,
       tone: (target && moCash >= target) ? "good" : (pace !== null && target && pace >= target ? "good" : "")}),
    cell("Cash collected", money(cash), {sub: delta(cash, pCash) || "selected weeks"}),
    cell("Revenue contracted", money(rev), {sub: (rev-cash) > 0 ? money(rev-cash) + " outstanding" : "fully collected"}),
    cell("Average cash collected", money(div(cash,closes)), {sub:"per closed deal"}),
    cell("Cash per live call", money(div(cash,held)), {sub:"benchmark $800–$2,000"})
  ], 2);

  h += panel("Webinar Funnel", [
    cell("Registrations", num(reg), {sub: delta(reg, pReg) || "selected weeks"}),
    cell("Attendance %", pct(div(att,reg)), {sub: num(att) + " attended live"}),
    cell("Applications", num(apps), {sub: delta(apps, pApps) || ""}),
    cell("Application %", pct(div(apps,att)), {sub:"of live attendees"}),
    naCell("Qualified %", "No qualified-application count exists in GHL or Typeform yet"),
    cell("Booking %", pct(div(booked,apps)), {sub: num(booked) + " calls booked"})
  ], 2);

  h += panel("Sales Calls", [
    cell("Calls due", num(due), {sub: delta(due, pDue) || ""}),
    cell("Calls held", num(held), {sub: delta(held, pHeld) || ""}),
    cell("Show %", pct(div(held,due)), {sub:"target " + pct0(tgt("Call show rate target",0.7)), tone: div(held,due) >= tgt("Call show rate target",0.7) ? "good" : ""}),
    cell("Offers pitched", num(offers), {sub: (div(offers,held) > 1)
      ? "more than calls held — see Data Health"
      : pct(div(offers,held)) + " of calls held"}),
    cell("Closes", num(closes), {sub: delta(closes, pCloses) || ""}),
    cell("Close %", pct(div(closes,held)), {sub:"of calls held &middot; target " + pct0(tgt("Close rate target",0.3)), tone: div(closes,held) >= tgt("Close rate target",0.3) ? "good" : ""})
  ], 2);

  h += '</div>';

  /* ---- row 2: deal structure / cancellations ---- */
  h += '<div class="row r2">';

  h += panel("Payment Plan Structure", [
    cell("Paid in full", num(pif), {sub: pct(div(pif, pif+plan)) + " of deals"}),
    cell("Payment plan", num(plan), {sub: pct(div(plan, pif+plan)) + " of deals"}),
    cell("Average contract", money(div(rev,closes)), {sub:"revenue per close"}),
    cell("Collected %", pct(div(cash,rev)), {sub: money(rev-cash) + " still owed on contracts"})
  ], 4);

  h += panel("Cancellations & Reschedules", [
    cell("Cancelled calls", num(canc), {sub: cancTracked ? pct(div(canc,cancTracked)) + " of " + num(cancTracked) + " tracked" : "not tracked in this range", tone: canc > 0 ? "bad" : ""}),
    cell("Rescheduled calls", num(resch), {sub: pct(div(resch,due)) + " of calls due"}),
    naCell("Refunds", "Whop key has no permissions; SCA pays by ACH so Stripe has nothing"),
    cell("Never dialed", num(sum(R.filter(r=>!agedOut(r["Week (Thu)"])),r=>r["Never Dialed"])), {sub:"appointments, last 28 days"})
  ], 4);

  h += '</div>';

  /* ---- charts ---- */
  h += '<div class="card"><div class="chart-head"><span class="chart-title">Cash collected by week</span>'
    + '<span class="chart-note">Dated on the call, from the closer EOC report</span></div>'
    + barChart(cats, R.map(r=>n(r["Cash Collected"])), {clip:"cf1", fmt:money, alt:"Cash collected by week"})
    + '</div>';

  h += '<div class="row r2">';
  h += '<div class="card"><div class="chart-head"><span class="chart-title">Registered vs attended live</span>'
    + '<span class="chart-note">Same unit, one axis</span></div>'
    + groupedBar(cats,
        {name:"Registered", color:"var(--c1)", vals:R.map(r=>n(r["Registered"]))},
        {name:"Attended live", color:"var(--c2)", vals:R.map(r=>n(r["Attended Live"]))},
        {clip:"cf2", alt:"Registered versus attended live by week"})
    + legend([{name:"Registered",color:"var(--c1)"},{name:"Attended live",color:"var(--c2)"}])
    + '</div>';
  h += '<div class="card"><div class="chart-head"><span class="chart-title">Conversion rates by week</span>'
    + '<span class="chart-note">All three share a percentage axis</span></div>'
    + lineChart(cats, [
        {name:"Attendance %", color:"var(--c1)", vals:R.map(r=>has(r["Show %"])?r["Show %"]:null)},
        {name:"Application %", color:"var(--c2)", vals:R.map(r=>has(r["App Rate % (of attendees)"])?r["App Rate % (of attendees)"]:null)},
        {name:"Close %", color:"var(--c3)", vals:R.map(r=>has(r["Close Rate %"])?r["Close Rate %"]:null)}
      ], {max:1, fmt:pct, alt:"Attendance, application and close rates by week"})
    + legend([{name:"Attendance %",color:"var(--c1)",line:1},{name:"Application %",color:"var(--c2)",line:1},{name:"Close %",color:"var(--c3)",line:1}])
    + '</div>';
  h += '</div>';

  /* ---- weekly table ---- */
  h += '<div class="panel"><div class="panel-head">Week by week</div><div class="tw">'
    + tableInner(["Week","Reg.","Attended","Att. %","Apps","App %","Booked","Due","Held","Show %","Closes","Close %","Cash","Source"],
      R.map(r => [
        esc(wkShort(r["Week (Thu)"])), num(r["Registered"]), num(r["Attended Live"]),
        has(r["Show %"])?pct(r["Show %"]):null, num(r["Applications"]),
        has(r["App Rate % (of attendees)"])?pct(r["App Rate % (of attendees)"]):null,
        num(r["Calls Booked (stream day)"]), num(r["Calls Due"]), num(r["Calls Held"]),
        has(r["Call Show %"])?pct(r["Call Show %"]):null, num(r["Closes"]),
        has(r["Close Rate %"])?pct(r["Close Rate %"]):null, money(r["Cash Collected"]), sourcePill(r)
      ]), {left:[13]}) + '</div></div>';

  const methods = Array.from(new Set(R.filter(r=>has(r["Attended Live"])).map(r=>sourceMethod(r["Attendance Source"])).filter(has)));
  const unverified = R.filter(r => String(r["Verified"]).toUpperCase() === "NO").length;
  if(methods.length > 1 || unverified){
    h += '<div class="note warn"><p><strong>Attendance % is only comparable within one measurement method.</strong> '
      + 'This range mixes ' + methods.length + ' ways of counting attendance (' + esc(methods.join(", ")) + ')'
      + (unverified ? ', and ' + unverified + ' week' + (unverified===1?" is":"s are") + ' still on the GHL click proxy, which ran 22% low against Zoom' : '')
      + '. The YouTube weeks counted channel traffic that never registered, so their attendance rate is a ceiling, not a floor.</p></div>';
  }

  document.getElementById("page-overview").innerHTML = h;
}

/* ---------------- TEAM ---------------- */
function renderTeam(){
  const R = wsRows(), C = csRows(), T = ssRows(), cats = R.map(r=>r["Week (Thu)"]);
  const Rlive = R.filter(r => !agedOut(r["Week (Thu)"]));
  const agedWeeks = R.filter(r => agedOut(r["Week (Thu)"])).map(r => wkShort(r["Week (Thu)"]));
  const appts = sum(Rlive,r=>r["Appts Booked (system)"]);
  const never = sum(Rlive,r=>r["Never Dialed"]);
  const dialedW = div(sum(Rlive,r=>n(r["Dialed <=20m %"])*n(r["Appts Booked (system)"])), appts);

  const byC = {}, byS = {};
  C.forEach(r => { const k=r["Closer"]; if(!k) return;
    byC[k] = byC[k] || {cash:0,rev:0,held:0,due:0,closes:0,pif:0};
    byC[k].cash+=n(r["Cash Collected"]); byC[k].rev+=n(r["Revenue Contracted"]);
    byC[k].held+=n(r["Calls Held"]); byC[k].due+=n(r["Calls Due"]); byC[k].closes+=n(r["Closes"]); });
  T.forEach(r => { const k=r["Setter"]; if(!k) return;
    byS[k] = byS[k] || {appts:0,held:0,cash:0,closes:0,eod:0,dialSum:0,dialN:0};
    byS[k].appts+=n(r["Appts Booked (system)"]); byS[k].held+=n(r["Calls Held"]);
    byS[k].cash+=n(r["Cash Collected"]); byS[k].closes+=n(r["Closes"]); byS[k].eod+=n(r["EOD Forms Filed"]);
    if(has(r["Avg Mins to Dial"])){ byS[k].dialSum += n(r["Avg Mins to Dial"]); byS[k].dialN++; } });

  const closers = Object.keys(byC).sort((a,b)=>byC[b].cash-byC[a].cash);
  /* Panels are for real people. "(UNASSIGNED)" and "NONE" are blank-field artifacts,
     and a closer occasionally gets typed into the setter box. They stay in the table
     below, where being visible is the point, but they don't get a scorecard. */
  const ARTIFACT = /^\(UNASSIGNED\)$|^NONE$/i;
  const setters = Object.keys(byS)
    .filter(k => !ARTIFACT.test(k) && byS[k].appts > 0 && !byC[k])
    .sort((a,b)=>byS[b].appts-byS[a].appts);

  let h = "";

  /* Scoreboards: one row per person, scored against the targets set on the
     Targets and Spend tab. Green = at or above target, red = below. */
  const closeT = tgt("Close rate target", 0.3), showT = tgt("Call show rate target", 0.7),
        dialT = tgt("Speed-to-lead target (mins)", 20);
  const scoreHi = (v,t) => v === null ? null : '<span class="pill '+(v >= t ? "ok" : "bad")+'">'+pct(v)+'</span>';
  const scoreLo = (v,t) => v === null ? null : '<span class="pill '+(v <= t ? "ok" : "bad")+'">'+num(v)+' min</span>';

  h += '<div class="panel"><div class="panel-head">Closer scoreboard &middot; close target '+pct0(closeT)+', show target '+pct0(showT)+'</div><div class="tw">'
    + tableInner(["Closer","Cash","Closes","Close %","Due","Held","Show %","Avg deal","Cash / call"],
      closers.map(k => { const c = byC[k]; return [
        esc(title(k)), money(c.cash), num(c.closes),
        scoreHi(div(c.closes,c.held), closeT),
        num(c.due), num(c.held),
        scoreHi(div(c.held,c.due), showT),
        money(div(c.cash,c.closes)), money(div(c.cash,c.held))
      ];})) + '</div></div>';

  h += '<div class="panel"><div class="panel-head">Setter scoreboard &middot; dial target '+num(dialT)+' min &middot; appointments cover the last 28 days only</div><div class="tw">'
    + tableInner(["Setter","Appts booked","Avg mins to dial","Dialed ≤20m","Held","Cash from sets","EOD filed"],
      setters.map(k => { const s = byS[k]; return [
        esc(title(k)), num(s.appts),
        scoreLo(s.dialN ? s.dialSum/s.dialN : null, dialT),
        s.appts > 0 ? pct(div(sum(T.filter(r=>r["Setter"]===k && !agedOut(r["Week (Thu)"])), r=>n(r["Dialed <=20m %"])*n(r["Appts Booked (system)"])), s.appts)) : null,
        num(s.held), money(s.cash), num(s.eod)
      ];})) + '</div></div>';

  /* ---- Commissions and payouts ----
     Earned = commission columns on the Cash Log (closer/setter rates from the
     Targets and Spend tab, applied to EOC-reported cash collected).
     Paid   = rows a human logs on the Payouts tab.
     Owed   = all-time earned minus all-time paid — deliberately NOT sliced by
     the date range, because a debt doesn't shrink when you narrow the picker. */
  const cRate = tgt("Closer commission rate", 0.10), sRate = tgt("Setter commission rate", 0.05);
  if(!Array.isArray(S.cl)){
    h += '<div class="panel"><div class="panel-head">Commissions &amp; payouts</div>'
      + '<div class="note warn" style="margin:0"><p><strong>Commission data unavailable.</strong> '
      + esc(S.cl && S.cl.message ? S.cl.message : String(S.cl)) + '</p></div></div>';
  }else{
    const norm = s => String(s||"").trim().toUpperCase();
    const PP = {};
    const addP = k => (PP[k] = PP[k] || {selC:0, selS:0, allC:0, allS:0, paid:0, roles:{}});
    S.cl.forEach(r => {
      const w = r["Week (Thu)"], sel = inRange(w);
      const c = norm(r["Closer"]), s = norm(r["Setter"]);
      if(c && !ARTIFACT.test(c)){ const p = addP(c); p.roles["Closer"] = 1;
        p.allC += n(r["Closer Commission"]); if(sel) p.selC += n(r["Closer Commission"]); }
      if(s && !ARTIFACT.test(s)){ const p = addP(s); p.roles["Setter"] = 1;
        p.allS += n(r["Setter Commission"]); if(sel) p.selS += n(r["Setter Commission"]); }
    });
    S.po.forEach(r => { const k = norm(r["Person"]);
      if(k && !ARTIFACT.test(k)) addP(k).paid += n(r["Amount Paid"]); });

    const people = Object.keys(PP).sort((a,b) =>
      (PP[b].allC + PP[b].allS - PP[b].paid) - (PP[a].allC + PP[a].allS - PP[a].paid));
    const latestWk = S.weeks.length ? S.weeks[S.weeks.length-1] : null;
    const latestEarned = sum(S.cl.filter(r => String(r["Week (Thu)"]) === String(latestWk)),
      r => n(r["Closer Commission"]) + n(r["Setter Commission"]));
    const selEarned = sum(S.cl.filter(r => inRange(r["Week (Thu)"])),
      r => n(r["Closer Commission"]) + n(r["Setter Commission"]));
    const allEarned = sum(S.cl, r => n(r["Closer Commission"]) + n(r["Setter Commission"]));
    const allPaid = sum(S.po, r => n(r["Amount Paid"]));
    const owedTot = allEarned - allPaid;

    h += panel("Commissions & payouts — closer " + pct0(cRate) + " / setter " + pct0(sRate) + " of cash collected", [
      cell("Owed to the team now", money(owedTot),
        {sub: allPaid > 0 ? "all-time earned minus payouts logged" : "no payouts logged yet",
         tone: owedTot > 0 ? "" : "good"}),
      cell("Earned, latest week", money(latestEarned), {sub: latestWk ? "week of " + wkShort(latestWk) : ""}),
      cell("Earned, selected range", money(selEarned), {sub: "commissions on cash collected in range"}),
      cell("Paid out, all time", money(allPaid), {sub: num(S.po.length) + " payout" + (S.po.length === 1 ? "" : "s") + " logged"})
    ], 4);

    h += '<div class="panel"><div class="panel-head">Payout board &middot; one row per person &middot; sorted by what they are owed</div><div class="tw">'
      + tableInner(["Person","Role","Earned (range)","Earned (all time)","Paid (all time)","Owed now"],
        people.map(k => { const p = PP[k]; const owed = p.allC + p.allS - p.paid;
          return [
            esc(title(k)),
            esc(Object.keys(p.roles).join(" + ")),
            money(p.selC + p.selS),
            money(p.allC + p.allS),
            money(p.paid),
            '<span class="pill ' + (owed > 0.005 ? "chk" : "ok") + '">' + money(owed) + '</span>'
          ];}), {left:[0,1]}) + '</div></div>';

    const deals = S.cl.filter(r => inRange(r["Week (Thu)"]));
    h += '<div class="panel"><div class="panel-head">Deals behind those numbers &middot; selected range'
      + (deals.length > 15 ? ' &middot; newest 15 of ' + num(deals.length) : '') + '</div><div class="tw">'
      + tableInner(["Date","Prospect","Cash","Pay type","Closer","Closer comm","Setter","Setter comm"],
        deals.slice(0, 15).map(r => [
          esc(fmtD(gvDate(r["Call Date"]))), esc(r["Prospect"]), money(n(r["Cash Collected"])),
          esc(r["Pay Type"]), esc(title(r["Closer"])), money(n(r["Closer Commission"])),
          r["Setter"] ? esc(title(r["Setter"])) : null, money(n(r["Setter Commission"]))
        ]), {left:[1,4,6]}) + '</div></div>';

    h += '<div class="note"><p><strong>Where these numbers come from.</strong> Deals land here automatically from the '
      + 'closers’ EOC forms via the Master Tracker’s Cash Log — nobody types deals in twice. Payouts are logged by hand on the '
      + 'Master Tracker’s <strong>Payouts</strong> tab (date, person, role, amount); until a payout is logged, everything earned shows as owed.</p>'
      + '<p style="color:var(--ink-3)">Commission applies to cash collected, so a payment-plan deal earns on the deposit now and on later '
      + 'installments only when those get filed through an EOC form. The same numbers live in the SCA Commission Tracker sheet.</p></div>';
  }

  h += '<div class="row r2">';
  h += '<div class="card"><div class="chart-head"><span class="chart-title">Speed to lead</span>'
    + '<span class="chart-note">Share of bookings dialed within 20 minutes</span></div>'
    + lineChart(cats, [{name:"Dialed ≤20m", color:"var(--c2)",
        vals:R.map(r => (!agedOut(r["Week (Thu)"]) && n(r["Appts Booked (system)"]) > 0) ? n(r["Dialed <=20m %"]) : null)}],
        {fmt:pct, alt:"Share of bookings dialed within twenty minutes, by week"})
    + '<p class="chart-note" style="margin:10px 0 0">Average across weeks still in the window '+pct(dialedW)
    + '. '+num(never)+' of '+num(appts)+' appointments were never dialed at all.</p></div>';
  h += '<div class="card"><div class="chart-head"><span class="chart-title">Cash collected by closer</span>'
    + '<span class="chart-note">Whole selected range</span></div>' + closerBars(closers, byC) + '</div>';
  h += '</div>';

  h += '<div class="panel"><div class="panel-head">Closers, week by week</div><div class="tw">'
    + tableInner(["Week","Closer","Due","Held","Show %","Closes","Close %","Cash","Avg deal"],
      C.map(r => [
        esc(wkShort(r["Week (Thu)"])), esc(title(r["Closer"])), num(r["Calls Due"]), num(r["Calls Held"]),
        has(r["Call Show %"])?pct(r["Call Show %"]):null, num(r["Closes"]),
        has(r["Close Rate %"])?pct(r["Close Rate %"]):null, money(r["Cash Collected"]),
        has(r["Cash AOV"])?money(r["Cash AOV"]):null
      ]), {left:[1]}) + '</div></div>';

  h += '<div class="panel"><div class="panel-head">Setters, week by week</div><div class="tw">'
    + tableInner(["Week","Setter","Appts booked","Dialed ≤20m","Avg mins to dial","Held","Cash","EOD filed"],
      T.map(r => [
        esc(wkShort(r["Week (Thu)"])), esc(title(r["Setter"])), num(r["Appts Booked (system)"]),
        has(r["Dialed <=20m %"])?pct(r["Dialed <=20m %"]):null,
        has(r["Avg Mins to Dial"])?num(r["Avg Mins to Dial"]):null,
        num(r["Calls Held"]), money(r["Cash Collected"]), num(r["EOD Forms Filed"])
      ]), {left:[1]}) + '</div></div>';

  if(agedWeeks.length){
    h += '<div class="note warn"><p><strong>Appointment data only covers the last 28 days.</strong> '
      + 'Speed to lead, never-dialed and dial times come from a rolling window that drops older bookings, so '
      + esc(agedWeeks.join(", ")) + ' no longer have any. Those weeks are left off the line rather than drawn at zero. '
      + 'Cash, closes and show rates are unaffected and go back to the beginning.</p></div>';
  }
  h += '<div class="note"><p><strong>Read &ldquo;EOD forms filed&rdquo; before trusting any self-reported number.</strong> '
    + 'It counts the days a setter actually filed, out of seven per week. Appointment counts and dial times come from the '
    + 'system and do not depend on anyone filing anything.</p>'
    + '<p style="color:var(--ink-3)">Per-setter appointment counts run about 12% below the team total, because the Setter Stats tab is '
    + 'built from the closer call log rather than the appointment log.</p></div>';

  document.getElementById("page-team").innerHTML = h;
}
function title(s){ s = String(s||""); return s.charAt(0) + s.slice(1).toLowerCase(); }

/* ---------------- WEBINARS (per-webinar drill-down) ---------------- */
function wdFor(date){
  const o = {meta:{}, curve:[], calendar:[], capacity:[], goal:[], blocker:[]};
  S.wd.forEach(r => {
    if(String(r["Date"]) !== date) return;
    const kind = String(r["Kind"]), k = r["Key"], v = r["Value"];
    if(kind === "meta") o.meta[String(k)] = v;
    else if(kind === "curve") o.curve.push([parseFloat(k), parseFloat(v)]);
    else if(o[kind]) o[kind].push([String(k), parseFloat(v)]);
  });
  o.curve.sort((a,b) => a[0]-b[0]);
  ["calendar","capacity","goal","blocker"].forEach(k => o[k].sort((a,b) => b[1]-a[1]));
  return o;
}
function shortLabel(s){
  s = String(s);
  if(/^Under \$500/.test(s)) return "Under $500";
  if(/^\$500/.test(s)) return "$500–$2,000";
  if(/^\$2,000/.test(s)) return "$2,000–$3,000";
  if(/^\$3,000/.test(s)) return "$3,000+";
  if(/10k\/month or more/.test(s)) return "$10k+/mo";
  if(/\$3k-\$9k/.test(s)) return "$3k–$9k/mo (replace job)";
  if(/\$1k-\$3k/.test(s)) return "$1k–$3k/mo (side hustle)";
  return s.length > 30 ? s.slice(0,29) + "…" : s;
}
function hbars(items, opt){
  opt = opt || {};
  if(!items.length) return '<p class="chart-note">No data for this webinar.</p>';
  const max = Math.max.apply(null, items.map(i => i[1]).concat([1]));
  const rowH = 34, H = items.length*rowH + 6;
  let out = '<svg viewBox="0 0 570 '+H+'" role="img" aria-label="'+esc(opt.alt||"")+'">';
  items.forEach((it,i) => {
    const y = i*rowH + 4, w = Math.max(it[1]/max*280, 2);
    out += '<text x="218" y="'+(y+16)+'" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="var(--ui)">'+esc(shortLabel(it[0]))+'</text>'
        + '<rect class="bar" x="226" y="'+y+'" width="'+w.toFixed(1)+'" height="22" rx="3" fill="'+(opt.color||"var(--c2)")+'"><title>'+esc(it[0])+' — '+num(it[1])+'</title></rect>'
        + '<text class="dlabel" x="'+(226+w+7).toFixed(1)+'" y="'+(y+16)+'">'+num(it[1])
        + (opt.total ? ' <tspan fill="var(--ink-3)">· '+pct0(it[1]/opt.total)+'</tspan>' : '') + '</text>';
  });
  return out + '</svg>';
}
function retentionChart(curve, pitchMin){
  if(!curve.length) return '<p class="chart-note">No retention data for this webinar.</p>';
  const endX = curve[curve.length-1][0];
  const maxY = niceMax(Math.max.apply(null, curve.map(p => p[1])));
  const X = m => PLOT.x0 + (m/endX)*PLOT.w, Y = v => PLOT.y1 - (v/maxY)*PLOT.h;
  let out = "";
  if(pitchMin !== null && pitchMin > 0 && pitchMin < endX){
    out += '<rect x="'+X(pitchMin).toFixed(1)+'" y="'+PLOT.y0+'" width="'+(X(endX)-X(pitchMin)).toFixed(1)
        + '" height="'+(PLOT.y1-PLOT.y0)+'" fill="var(--surface-3)" opacity="0.75"/>'

const PLOT = { x0:52, x1:552, y0:14, y1:170, w:500, h:156 };
function gridSvg(max, fmt, count){
  count = count || 4;
  let g = '<g class="gridline">', t = '<g class="axis-txt" text-anchor="end">';

    t += '<text x="'+(PLOT.x0-7)+'" y="'+(y+3.4).toFixed(1)+'">'+fmt(v)+'</text>';

function xLabels(cats){

function niceMax(v){ if(!(v > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v/mag*2)/2*mag; }
function barChart(cats, vals, opt){

function sourceMethod(s){

function daysSince(wk){

/* Presets are the primary control; the calendar pickers are the escape hatch.
   Picking a date by hand flips the preset to Custom so the label never lies. */
function applyPreset(p){
  if(p === "custom") return;
  S.toD = isoShift(0);
  S.fromD = p === "all" ? S.weeks[0] : isoShift(-(+p - 1));
  document.getElementById("from").value = S.fromD;
  document.getElementById("to").value = S.toD;
}
function buildRange(){
  const from = document.getElementById("from"), to = document.getElementById("to"),
        preset = document.getElementById("preset");
  from.min = S.weeks[0]; to.min = S.weeks[0];
  from.max = isoShift(0); to.max = isoShift(0);
  if(S.fromD){ from.value = S.fromD; to.value = S.toD; }
  preset.onchange = () => { applyPreset(preset.value); renderAll(); };
  from.onchange = () => { if(!from.value) return; preset.value = "custom"; S.fromD = from.value;
    if(S.fromD > S.toD){ S.toD = S.fromD; to.value = S.toD; } renderAll(); };
  to.onchange   = () => { if(!to.value) return; preset.value = "custom"; S.toD = to.value;
    if(S.toD < S.fromD){ S.fromD = S.toD; from.value = S.fromD; } renderAll(); };
}
function wireTabs(){
  const tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  function sel(t, push){
    tabs.forEach(x => { const on = x === t;
      x.setAttribute("aria-selected", on ? "true" : "false");
      document.getElementById(x.getAttribute("aria-controls")).hidden = !on; });
    if(push !== false) location.hash = t.id.replace("tab-","");
  }
  const wanted = tabs.filter(t => t.id === "tab-" + location.hash.replace("#",""))[0];
  if(wanted) sel(wanted, false);
  tabs.forEach(t => {
    t.addEventListener("click", () => sel(t));
    t.addEventListener("keydown", e => {
      const i = tabs.indexOf(t); let x = null;
      if(e.key === "ArrowRight") x = tabs[(i+1) % tabs.length];
      if(e.key === "ArrowLeft")  x = tabs[(i-1+tabs.length) % tabs.length];
      if(x){ e.preventDefault(); x.focus(); sel(x); }
    });
  });
}
function fail(err){
  document.getElementById("boot").hidden = true;
  const el = document.getElementById("fail"); el.hidden = false;
  el.innerHTML = '<div class="banner"><strong>The dashboard could not read the Master Tracker.</strong>'
    + esc(err && err.message ? err.message : String(err))
    + '<div style="margin-top:12px"><a class="ghost" href="'+SHEET_URL+'" target="_blank" rel="noopener">Open the sheet</a></div></div>';
  document.getElementById("dot").className = "dot bad";
  document.getElementById("status-txt").textContent = "Failed to load";
  throw err;
}
async function load(preserveRange){
  let out;
  try{
    /* Cash Log and Payouts feed the commissions section only, so a failure
       there degrades that one section instead of killing the whole page. */
    out = await Promise.all([gviz("Weekly Scorecard"), gviz("Closer Stats"),
                             gviz("Setter Stats"), gviz("Data Health"), gviz("Monthly"),
                             gviz("Webinar Detail"), gviz("Targets and Spend"),
                             gviz("Cash Log").catch(e => e), gviz("Payouts").catch(e => e)]);
  }catch(e){ if(preserveRange){ return; } fail(e); return; }

  S.ws = out[0].filter(r => has(r["Week (Thu)"]));
  S.cs = out[1].filter(r => has(r["Week (Thu)"]));
  S.ss = out[2].filter(r => has(r["Week (Thu)"]));
  S.dh = out[3];
  S.mo = out[4].filter(r => has(r["Month"]));
  S.wd = out[5].filter(r => has(r["Date"]) && has(r["Kind"]));
  S.tg = {};
  out[6].forEach(r => { if(has(r["Setting"]) && has(r["Value"])) S.tg[r["Setting"]] = r["Value"]; });
  S.cl = Array.isArray(out[7]) ? out[7].filter(r => has(r["Week (Thu)"]) && has(r["Closer"])) : out[7];
  S.po = Array.isArray(out[8]) ? out[8].filter(r => has(r["Person"]) && has(r["Amount Paid"])) : [];
  if(!S.ws.length){ if(!preserveRange) fail(new Error("The Weekly Scorecard tab returned no populated weeks. Check the Apps Script is still writing to this sheet.")); return; }

  S.weeks = S.ws.map(r => r["Week (Thu)"]).sort();
  const preset = document.getElementById("preset");
  const keep = preserveRange && preset.value === "custom" && S.fromD && S.toD;
  S.fetched = new Date();

  buildRange();
  if(!keep) applyPreset(preset.value);
  renderAll();

  /* Freshness: weeks are Thursday-anchored, so if the newest row is more than
     7 days old a webinar Thursday has passed without the Apps Script writing
     its row. That is a pipeline failure, not "no news" — say so loudly. */
  const latest = S.weeks[S.weeks.length-1];
  const stale = daysSince(latest);
  const staleEl = document.getElementById("stale");
  if(stale > 7){
    staleEl.hidden = false;
    staleEl.innerHTML = '<div class="banner"><strong>Data stopped on ' + esc(wkRange(latest)) + '.</strong>'
      + 'The Thursday webinar after that has no row, which means the Apps Script trigger in the '
      + 'Master Tracker did not fire (it also silently failed on 7/30 and 8/6). Everything below is '
      + 'accurate through ' + esc(wkShort(latest)) + ' but blind after it. Fix: open the Apps Script on the '
      + 'Master Tracker and run <code>diagnoseTriggers()</code>, then <code>setupTriggers()</code>.</div>';
  } else { staleEl.hidden = true; }

  document.getElementById("dot").className = "dot" + (stale > 7 ? " warn" : "");
  document.getElementById("status-txt").textContent =
    "Live · " + S.fetched.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) +
    (stale > 7 ? " · data ends " + wkShort(latest) : "");
  document.getElementById("foot-fetch").textContent =
    "Data through " + wkRange(latest) + " · fetched " + S.fetched.toLocaleString() +
    " · refreshes every 10 min while open";
  document.getElementById("boot").hidden = true;
  document.getElementById("app").hidden = false;
}
async function boot(){
  document.getElementById("sheet-link").href = SHEET_URL;
  document.getElementById("foot-sheet").href = SHEET_URL;
  wireTabs();
  const pill = document.getElementById("health-pill"), pop = document.getElementById("health-pop");
  pill.addEventListener("click", () => {
    pop.hidden = !pop.hidden;
    pill.setAttribute("aria-expanded", String(!pop.hidden));
  });
  await load(false);
  /* Keep the page current without a manual reload: re-pull every 10 minutes,
     and immediately when the tab regains focus after 10+ minutes away. */
  setInterval(() => load(true), 10*60*1000);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && S.fetched && (Date.now() - S.fetched.getTime()) > 10*60*1000) load(true);
  });
}
boot();
</script>
</body>
</html>
